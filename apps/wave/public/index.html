<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WAVE">
<meta name="theme-color" content="#7c3aed">
<title>WAVE by MCF</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#06060f;--s1:#0c0c1e;--s2:#131328;--s3:#1c1c38;
  --b1:#1e1e38;--b2:#2e2e50;--b3:#3e3e68;
  --p:#7c3aed;--ph:#9155ff;--pg:rgba(124,58,237,.35);
  --t1:#f0f0ff;--t2:#9898c0;--t3:#5a5a80;
  --green:#22c55e;--gg:rgba(34,197,94,.25);
  --amber:#f59e0b;--red:#ef4444;
  --r:14px;--rm:20px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.5}

/* ── Auth ─────────────────────────────────────────────────────────────────── */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:100}
.auth-card{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--b1);border-radius:24px;padding:40px 32px;display:flex;flex-direction:column;align-items:center;gap:24px;box-shadow:0 0 60px rgba(124,58,237,.15)}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:8px}
.wave-icon{width:64px;height:64px;background:var(--p);border-radius:20px;display:flex;align-items:center;justify-content:center}
.wave-icon svg{width:36px;height:36px}
.auth-logo h1{font-size:2rem;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-logo p{color:var(--t3);font-size:.85rem}
.auth-tabs{display:flex;gap:0;background:var(--s2);border-radius:10px;padding:4px;width:100%}
.auth-tab{flex:1;padding:9px;border:none;background:none;color:var(--t2);border-radius:7px;cursor:pointer;font-size:.9rem;font-weight:600;transition:.2s}
.auth-tab.active{background:var(--p);color:#fff}
.auth-form{width:100%;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.8rem;color:var(--t3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.field input{background:var(--s2);border:1.5px solid var(--b1);border-radius:10px;padding:13px 15px;color:var(--t1);font-size:1rem;outline:none;transition:.2s;width:100%}
.field input:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pg)}
.field input::placeholder{color:var(--t3)}
.btn-primary{width:100%;padding:14px;background:var(--p);border:none;border-radius:11px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.btn-primary:active{transform:scale(.98)}
.btn-primary:hover{background:var(--ph)}
.auth-hint{color:var(--t3);font-size:.8rem;text-align:center;line-height:1.6}
.auth-hint b{color:var(--t2)}
#auth-error{color:var(--red);font-size:.85rem;text-align:center;min-height:18px}

/* ── Layout ───────────────────────────────────────────────────────────────── */
#app{display:flex;height:100vh;width:100vw;overflow:hidden}
.hidden{display:none!important}

/* ── Sidebar ──────────────────────────────────────────────────────────────── */
#sidebar{width:320px;min-width:320px;background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sb-head{padding:18px 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--b1)}
.sb-logo{display:flex;align-items:center;gap:8px;flex:1}
.sb-logo .wave-sm{width:32px;height:32px;background:var(--p);border-radius:9px;display:flex;align-items:center;justify-content:center}
.sb-logo .wave-sm svg{width:18px;height:18px}
.sb-logo h2{font-size:1.1rem;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-head-btns{display:flex;gap:8px}
.icon-btn{width:34px;height:34px;background:var(--s2);border:1px solid var(--b1);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--s3);color:var(--t1)}
.icon-btn svg{width:16px;height:16px}
.sb-search{padding:10px 14px;border-bottom:1px solid var(--b1)}
.sb-search input{width:100%;background:var(--s2);border:1.5px solid var(--b1);border-radius:9px;padding:9px 14px;color:var(--t1);font-size:.9rem;outline:none;transition:.2s}
.sb-search input:focus{border-color:var(--p)}
.sb-search input::placeholder{color:var(--t3)}
.rooms-list{flex:1;overflow-y:auto;padding:6px 0}
.rooms-list::-webkit-scrollbar{width:4px}
.rooms-list::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.room-item{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;transition:.15s;border-radius:0;position:relative}
.room-item:hover{background:var(--s2)}
.room-item.active{background:linear-gradient(90deg,rgba(124,58,237,.2),transparent);border-left:3px solid var(--p)}
.room-item.active .ri-name{color:var(--t1)}
.room-avatar{width:46px;height:46px;border-radius:14px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;color:var(--t1);flex-shrink:0;position:relative}
.room-avatar.group{background:linear-gradient(135deg,var(--p),#4f46e5)}
.room-avatar.dm{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.online-dot{position:absolute;bottom:2px;right:2px;width:11px;height:11px;background:var(--green);border-radius:50%;border:2px solid var(--s1)}
.ri-info{flex:1;min-width:0}
.ri-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ri-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1)}
.ri-time{font-size:.72rem;color:var(--t3);flex-shrink:0}
.ri-preview{font-size:.82rem;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ri-badge{background:var(--p);color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;padding:2px 7px;flex-shrink:0}
.sb-footer{padding:12px;border-top:1px solid var(--b1);display:flex;flex-direction:column;gap:8px}
.my-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s2);border-radius:12px;border:1px solid var(--b1)}
.my-avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--p),#4f46e5);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;color:#fff;flex-shrink:0}
.my-info{flex:1;min-width:0}
.my-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-code{font-size:.75rem;color:var(--t3);font-family:monospace;letter-spacing:.05em}
.copy-code{background:var(--s3);border:none;border-radius:7px;padding:6px 10px;color:var(--t2);font-size:.75rem;cursor:pointer;white-space:nowrap;transition:.15s}
.copy-code:hover{color:var(--t1);background:var(--b2)}
.sb-actions{display:flex;gap:8px}
.sb-action{flex:1;padding:10px;background:var(--s2);border:1.5px solid var(--b1);border-radius:10px;color:var(--t2);font-size:.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.sb-action:hover{border-color:var(--p);color:var(--t1);background:rgba(124,58,237,.1)}
.sb-action svg{width:15px;height:15px}

/* ── Chat ─────────────────────────────────────────────────────────────────── */
#chat{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--t3)}
.chat-empty .big-icon{width:80px;height:80px;background:var(--s1);border-radius:24px;display:flex;align-items:center;justify-content:center}
.chat-empty .big-icon svg{width:40px;height:40px;color:var(--b3)}
.chat-empty p{font-size:.9rem}
.chat-head{padding:12px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:12px;background:var(--s1);flex-shrink:0}
.back-btn{display:none;background:none;border:none;color:var(--t2);cursor:pointer;padding:6px;border-radius:8px}
.back-btn:hover{color:var(--t1)}
.ch-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--p),#4f46e5);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.ch-info{flex:1}
.ch-name{font-weight:700;font-size:1rem}
.ch-meta{font-size:.78rem;color:var(--t3)}
.ch-meta span.on{color:var(--green)}
.ch-code{font-family:monospace;font-size:.75rem;color:var(--t3);background:var(--s2);border:1px solid var(--b1);padding:3px 8px;border-radius:6px;cursor:pointer;transition:.15s}
.ch-code:hover{border-color:var(--p);color:var(--t2)}

/* ── Messages ─────────────────────────────────────────────────────────────── */
#messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:4px}
#messages::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.msg-row{display:flex;align-items:flex-end;gap:8px;max-width:100%}
.msg-row.mine{flex-direction:row-reverse}
.msg-row.mine+.msg-row.mine .msg-avatar,
.msg-row:not(.mine)+.msg-row:not(.mine) .msg-avatar{opacity:0;pointer-events:none}
.msg-avatar{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:#fff;flex-shrink:0;align-self:flex-end}
.msg-row.mine .msg-avatar{background:linear-gradient(135deg,var(--p),#4f46e5)}
.msg-wrap{max-width:72%;display:flex;flex-direction:column;gap:2px}
.msg-row.mine .msg-wrap{align-items:flex-end}
.msg-sender{font-size:.72rem;color:var(--t3);padding:0 4px;margin-bottom:1px}
.bubble{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rm) var(--rm) var(--rm) 4px;padding:10px 13px;color:var(--t1);font-size:.93rem;line-height:1.5;word-break:break-word;max-width:100%;position:relative}
.msg-row.mine .bubble{background:linear-gradient(135deg,var(--p),#5b21b6);border-color:transparent;border-radius:var(--rm) var(--rm) 4px var(--rm);color:#fff}
.bubble-time{font-size:.68rem;color:rgba(255,255,255,.4);margin-top:4px;display:block;text-align:right}
.msg-row:not(.mine) .bubble-time{color:var(--t3)}

/* voice bubble */
.voice-bubble{display:flex;align-items:center;gap:10px;padding:10px 14px;min-width:180px}
.play-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.play-btn:hover{background:rgba(255,255,255,.25)}
.play-btn svg{width:14px;height:14px;margin-left:2px}
.msg-row:not(.mine) .play-btn{background:var(--p);color:#fff}
.msg-row:not(.mine) .play-btn:hover{background:var(--ph)}
.waveform{flex:1;display:flex;align-items:center;gap:2px;height:32px}
.waveform span{display:block;width:3px;border-radius:2px;background:rgba(255,255,255,.4);transition:height .15s}
.msg-row:not(.mine) .waveform span{background:var(--b3)}
.waveform.playing span{background:rgba(255,255,255,.8);animation:wv .5s ease-in-out infinite alternate}
.msg-row:not(.mine) .waveform.playing span{background:var(--p)}
@keyframes wv{0%{height:4px}100%{height:24px}}
.waveform span:nth-child(2n){animation-delay:.1s}
.waveform span:nth-child(3n){animation-delay:.2s}
.waveform span:nth-child(4n){animation-delay:.05s}
.voice-dur{font-size:.75rem;color:rgba(255,255,255,.5);flex-shrink:0}
.msg-row:not(.mine) .voice-dur{color:var(--t3)}

/* system message */
.sys-msg{text-align:center;font-size:.78rem;color:var(--t3);padding:8px 0;display:flex;align-items:center;gap:8px}
.sys-msg::before,.sys-msg::after{content:'';flex:1;height:1px;background:var(--b1)}

/* typing */
#typing-bar{height:28px;padding:0 14px;display:flex;align-items:center;flex-shrink:0}
.typing-text{font-size:.8rem;color:var(--t3);display:flex;align-items:center;gap:6px}
.typing-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--t3);animation:td .9s infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes td{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ── PTT talking indicator ────────────────────────────────────────────────── */
#ptt-indicator{height:0;overflow:hidden;background:linear-gradient(90deg,rgba(245,158,11,.1),transparent);border-top:1px solid transparent;display:flex;align-items:center;gap:10px;padding:0 16px;transition:.25s;color:var(--amber);font-size:.85rem;font-weight:600}
#ptt-indicator.active{height:40px;border-color:rgba(245,158,11,.3)}
.ptt-wave{display:flex;align-items:center;gap:2px}
.ptt-wave span{display:block;width:3px;height:4px;border-radius:2px;background:var(--amber);animation:wv .4s ease-in-out infinite alternate}
.ptt-wave span:nth-child(2){animation-delay:.1s;height:12px}
.ptt-wave span:nth-child(3){animation-delay:.2s;height:18px}
.ptt-wave span:nth-child(4){animation-delay:.1s;height:12px}
.ptt-wave span:nth-child(5){animation-delay:.05s}

/* ── Input area ───────────────────────────────────────────────────────────── */
.input-area{padding:10px 12px;background:var(--s1);border-top:1px solid var(--b1);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
#text-input{flex:1;background:var(--s2);border:1.5px solid var(--b1);border-radius:22px;padding:10px 16px;color:var(--t1);font-size:.95rem;resize:none;outline:none;transition:.2s;max-height:120px;overflow-y:auto;font-family:inherit;line-height:1.5}
#text-input:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pg)}
#text-input::placeholder{color:var(--t3)}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--p);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.send-btn:hover{background:var(--ph)}
.send-btn:active{transform:scale(.93)}
.send-btn svg{width:18px;height:18px;transform:translateX(1px)}
.ptt-btn{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--p);background:transparent;color:var(--p);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;position:relative;-webkit-user-select:none;user-select:none;touch-action:none}
.ptt-btn svg{width:22px;height:22px;pointer-events:none}
.ptt-btn:hover{background:rgba(124,58,237,.12)}
.ptt-btn.recording{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 0 0 8px var(--pg),0 0 0 16px rgba(124,58,237,.1);animation:pulse-rec .8s ease-in-out infinite}
@keyframes pulse-rec{0%,100%{box-shadow:0 0 0 6px var(--pg),0 0 0 14px rgba(124,58,237,.08)}50%{box-shadow:0 0 0 10px var(--pg),0 0 0 20px rgba(124,58,237,.12)}}

/* ── Modal ────────────────────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--s1);border:1px solid var(--b2);border-radius:20px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:1.1rem;font-weight:700}
.modal-close{background:var(--s2);border:1px solid var(--b1);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);transition:.15s}
.modal-close:hover{color:var(--t1)}
.modal-tabs{display:flex;background:var(--s2);border-radius:10px;padding:4px;gap:0}
.modal-tab{flex:1;padding:8px;border:none;background:none;color:var(--t2);border-radius:7px;cursor:pointer;font-size:.88rem;font-weight:600;transition:.2s}
.modal-tab.active{background:var(--p);color:#fff}
.lookup-result{background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}
.lookup-avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--p),#4f46e5);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.lookup-info{flex:1}
.lookup-name{font-weight:600}
.lookup-sub{font-size:.8rem;color:var(--t3)}
.modal-error{color:var(--red);font-size:.83rem;text-align:center}

/* ── Toast ────────────────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--s3);border:1px solid var(--b2);border-radius:12px;padding:10px 18px;font-size:.88rem;color:var(--t1);opacity:0;transition:.3s;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Responsive ───────────────────────────────────────────────────────────── */
@media(max-width:700px){
  #sidebar{width:100%;min-width:unset;position:absolute;z-index:10;inset:0;transform:translateX(0);transition:.3s}
  #sidebar.hidden-mobile{transform:translateX(-100%)}
  #chat{position:absolute;inset:0}
  .back-btn{display:flex}
  .ch-code{display:none}
}
</style>
</head>
<body>

<!-- ── Auth Screen ─────────────────────────────────────────────────────────── -->
<div id="auth">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="wave-icon">
        <svg viewBox="0 0 36 36" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <path d="M2 18 Q6 8 10 18 Q14 28 18 18 Q22 8 26 18 Q30 28 34 18"/>
        </svg>
      </div>
      <h1>WAVE</h1>
      <p>by MCF Websites · Voice &amp; text, always on</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="setAuthTab('new')">New Account</button>
      <button class="auth-tab" onclick="setAuthTab('existing')">I Have a Code</button>
    </div>
    <form class="auth-form" id="auth-form" onsubmit="doAuth(event)">
      <div class="field" id="name-field">
        <label>Your Name</label>
        <input id="auth-name" type="text" placeholder="e.g. Christopher" autocomplete="name" maxlength="32">
      </div>
      <div class="field hidden" id="code-field">
        <label>Your 6-Character Code</label>
        <input id="auth-code" type="text" placeholder="e.g. XK8F2M" maxlength="6" style="text-transform:uppercase;letter-spacing:.15em;font-family:monospace">
      </div>
      <p id="auth-error"></p>
      <button class="btn-primary" type="submit" id="auth-btn">Create Account →</button>
    </form>
    <p class="auth-hint">Your <b>6-character code</b> lets others add you.<br>Share it like a phone number.</p>
  </div>
</div>

<!-- ── Main App ───────────────────────────────────────────────────────────── -->
<div id="app" class="hidden">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">
        <div class="wave-sm">
          <svg viewBox="0 0 36 36" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round">
            <path d="M2 18 Q6 8 10 18 Q14 28 18 18 Q22 8 26 18 Q30 28 34 18"/>
          </svg>
        </div>
        <h2>WAVE</h2>
      </div>
      <div class="sb-head-btns">
        <div class="icon-btn" title="New chat" onclick="openModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
    </div>
    <div class="sb-search">
      <input type="text" id="search-input" placeholder="Search rooms…" oninput="filterRooms(this.value)">
    </div>
    <div class="rooms-list" id="rooms-list">
      <div style="padding:40px 16px;text-align:center;color:var(--t3);font-size:.88rem">
        No conversations yet.<br>Tap <b>+</b> to start one.
      </div>
    </div>
    <div class="sb-footer">
      <div class="my-card">
        <div class="my-avatar" id="my-avatar">?</div>
        <div class="my-info">
          <div class="my-name" id="my-name">—</div>
          <div class="my-code" id="my-code-label">———</div>
        </div>
        <button class="copy-code" onclick="copyMyCode()">Copy code</button>
      </div>
      <div class="sb-actions">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Add Contact
        </button>

  <!-- Chat -->
  <main id="chat">

    <div id="chat-view" class="hidden" style="display:flex;flex-direction:column;height:100%">
      <div class="chat-head">

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="ch-avatar" id="ch-avatar">?</div>

      <div id="ptt-indicator">

        </button>
        <button class="ptt-btn" id="ptt-btn"
          onmousedown="startPTT(event)" onmouseup="stopPTT()" onmouseleave="stopPTT()"
          ontouchstart="startPTT(event)" ontouchend="stopPTT()" ontouchcancel="stopPTT()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2H3v2a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12v-2h-2z" fill-rule="evenodd"/></svg>
        </button>

    </div>

</div>

<!-- ── Add / Create Modal ──────────────────────────────────────────────────── -->
<div class="modal-overlay hidden" id="modal" onclick="closeModalOutside(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="modal-title">Start a Conversation</h3>
      <div class="modal-close" onclick="closeModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

      <button class="modal-tab active" onclick="setModalTab('join')">Add by Code</button>
      <button class="modal-tab" onclick="setModalTab('create')">New Room</button>
    </div>
    <!-- Join tab -->
    <div id="modal-join">
      <div class="field">
        <label>Enter Code</label>
        <input id="modal-code" type="text" placeholder="Person or room code (e.g. XK8F2M)"
          maxlength="12" style="text-transform:uppercase;letter-spacing:.1em;font-family:monospace"
          oninput="lookupCode(this.value)">
      </div>
      <div id="lookup-result" class="hidden">
        <div class="lookup-result">
          <div class="lookup-avatar" id="lr-avatar">?</div>
          <div class="lookup-info">

            <div class="lookup-sub" id="lr-sub">—</div>

        </div>

      <button class="btn-primary" onclick="doJoin()" id="modal-join-btn" disabled style="opacity:.5">Start Chat →</button>
    </div>
    <!-- Create tab -->
    <div id="modal-create" class="hidden">
      <div class="field">
        <label>Room Name</label>
        <input id="modal-room-name" type="text" placeholder="e.g. MCF Team, Family, Friends" maxlength="40">
      </div>
      <button class="btn-primary" onclick="doCreate()">Create Room →</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────────
let socket, me, rooms = {}, activeRoom = null, unread = {}, lookupDebounce;
let mediaRec = null, audioChunks = [], isRecording = false, recStart = 0;
let typingTimer = {}, pttTimers = {};
const online = {};

// ── Init ───────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const saved = localStorage.getItem('wave_user');
  if (saved) {
    try { startApp(JSON.parse(saved)); return; } catch {}
  }
  document.getElementById('auth').classList.remove('hidden');
});

function setAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (tab==='new'&&i===0)||(tab==='existing'&&i===1)));
  document.getElementById('name-field').classList.toggle('hidden', tab !== 'new');
  document.getElementById('code-field').classList.toggle('hidden', tab !== 'existing');
  document.getElementById('auth-btn').textContent = tab === 'new' ? 'Create Account →' : 'Sign In →';
}

async function doAuth(e) {
  e.preventDefault();
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  const isNew = document.querySelector('.auth-tab.active').textContent.includes('New');
  const body = isNew
    ? { name: document.getElementById('auth-name').value.trim() }
    : { code: document.getElementById('auth-code').value.trim().toUpperCase() };
  if (isNew && !body.name) return (errEl.textContent = 'Enter your name');
  if (!isNew && (!body.code || body.code.length < 4)) return (errEl.textContent = 'Enter your code');
  try {
    const r = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json();
    if (data.error) return (errEl.textContent = data.error);
    localStorage.setItem('wave_user', JSON.stringify(data));
    startApp(data);
  } catch { errEl.textContent = 'Connection error'; }
}

function startApp(user) {
  me = user;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('my-avatar').textContent = me.avatar;
  document.getElementById('my-name').textContent = me.name;
  document.getElementById('my-code-label').textContent = 'Code: ' + me.code;
  connectSocket();
  requestNotifPermission();
}

// ── Socket ─────────────────────────────────────────────────────────────────────
function connectSocket() {
  socket = io({ transports: ['websocket', 'polling'] });
  socket.on('connect', () => socket.emit('auth', { code: me.code }));
  socket.on('authed', ({ user, rooms: roomList }) => {
    me = user;
    roomList.forEach(r => addOrUpdateRoom(r));
    renderRoomList();
  });
  socket.on('room-joined', (room) => { addOrUpdateRoom(room); renderRoomList(); if (!activeRoom) openRoom(room.code); else openRoom(room.code); });
  socket.on('join-error', (msg) => { showToast('⚠️ ' + msg); });
  socket.on('msg', ({ roomCode, msg }) => { appendMsg(roomCode, msg); });
  socket.on('sys', ({ roomCode, msg }) => { appendMsg(roomCode, msg); });
  socket.on('typing', ({ code, name, on }) => { updateTyping(code, name, on); });
  socket.on('ptt-start', ({ code, name, roomCode }) => {
    if (roomCode === activeRoom) {
      document.getElementById('ptt-indicator').classList.add('active');
      document.getElementById('ptt-talker').textContent = name + ' is talking…';
    }
    pttTimers[code] = setTimeout(() => clearPTT(code), 10000);
  });
  socket.on('ptt-end', ({ code, roomCode }) => { clearPTT(code, roomCode); });
  socket.on('presence', ({ code, online: isOnline }) => {
    online[code] = isOnline;
    updatePresence(code, isOnline);
    if (activeRoom) updateChatMeta();
  });
  socket.on('error', (msg) => showToast('❌ ' + msg));
  socket.on('disconnect', () => showToast('Reconnecting…'));
}

function clearPTT(code, roomCode) {
  clearTimeout(pttTimers[code]);
  delete pttTimers[code];
  if (!Object.keys(pttTimers).length) {
    document.getElementById('ptt-indicator').classList.remove('active');
  }
}

// ── Room management ────────────────────────────────────────────────────────────
function addOrUpdateRoom(room) {
  rooms[room.code] = room;
  if (!unread[room.code]) unread[room.code] = 0;
  (room.memberDetails || []).forEach(u => { online[u.code] = online[u.code] || false; });
}

function getRoomDisplay(room) {
  if (room.type === 'dm') {
    const other = (room.memberDetails || []).find(u => u.code !== me.code);
    return { name: other?.name || 'Direct Message', avatar: other?.avatar || '?', type: 'dm', otherCode: other?.code };
  }
  return { name: room.name || 'Room', avatar: (room.name || 'R')[0].toUpperCase(), type: 'group' };
}

function renderRoomList(filter = '') {
  const list = document.getElementById('rooms-list');
  const items = Object.values(rooms).filter(r => {
    const d = getRoomDisplay(r);
    return !filter || d.name.toLowerCase().includes(filter.toLowerCase());
  });
  if (!items.length) {
    list.innerHTML = `<div style="padding:40px 16px;text-align:center;color:var(--t3);font-size:.88rem">No conversations yet.<br>Tap <b>+</b> to start one.</div>`;
    return;
  }
  list.innerHTML = items.map(r => {
    const d = getRoomDisplay(r);
    const last = r.messages?.slice(-1)[0];
    const preview = last ? (last.type === 'voice' ? '🎙 Voice message' : last.type === 'sys' ? last.text : last.text) : 'No messages yet';
    const t = last ? fmtTime(last.at) : '';
    const isOnline = d.type === 'dm' && d.otherCode && online[d.otherCode];
    const badge = unread[r.code] > 0 ? `<span class="ri-badge">${unread[r.code]}</span>` : '';
    return `<div class="room-item${r.code===activeRoom?' active':''}" onclick="openRoom('${r.code}')">
      <div class="room-avatar ${d.type}">${d.avatar}${isOnline ? '<span class="online-dot"></span>' : ''}</div>
      <div class="ri-info">
        <div class="ri-top"><span class="ri-name">${esc(d.name)}</span><span class="ri-time">${t}</span></div>
        <div class="ri-top"><span class="ri-preview">${esc(preview.slice(0,60))}</span>${badge}</div>
      </div>
    </div>`;
  }).join('');
}

function filterRooms(v) { renderRoomList(v); }

// ── Open a room ────────────────────────────────────────────────────────────────
function openRoom(code) {
  activeRoom = code;
  unread[code] = 0;
  const room = rooms[code];
  if (!room) return;
  const d = getRoomDisplay(room);

  // Mobile: hide sidebar
  if (window.innerWidth <= 700) {
    document.getElementById('sidebar').classList.add('hidden-mobile');
  }

  document.getElementById('chat-empty').classList.add('hidden');
  const cv = document.getElementById('chat-view');
  cv.classList.remove('hidden');
  cv.style.display = 'flex';

  document.getElementById('ch-avatar').textContent = d.avatar;
  document.getElementById('ch-name').textContent = d.name;
  document.getElementById('ch-code').textContent = room.type === 'group' ? '# ' + room.code : '';
  updateChatMeta();

  // Render messages
  const msgsEl = document.getElementById('messages');
  msgsEl.innerHTML = '';
  (room.messages || []).forEach(m => renderMsg(m, false));
  msgsEl.scrollTop = msgsEl.scrollHeight;

  renderRoomList(document.getElementById('search-input').value);
  document.getElementById('text-input').focus();
}

function updateChatMeta() {
  const room = rooms[activeRoom];
  if (!room) return;
  const d = getRoomDisplay(room);
  let meta = '';
  if (room.type === 'dm' && d.otherCode) {
    meta = online[d.otherCode] ? '<span class="on">● Online</span>' : 'Offline';
  } else {
    const count = (room.memberDetails || []).length;
    const onCount = (room.memberDetails || []).filter(u => online[u.code]).length;
    meta = `${count} members · <span class="on">${onCount} online</span>`;
  }
  document.getElementById('ch-meta').innerHTML = meta;
}

function showSidebar() {
  document.getElementById('sidebar').classList.remove('hidden-mobile');
}

// ── Messages ───────────────────────────────────────────────────────────────────
function appendMsg(roomCode, msg) {
  if (!rooms[roomCode]) return;
  rooms[roomCode].messages = rooms[roomCode].messages || [];
  rooms[roomCode].messages.push(msg);
  if (roomCode === activeRoom) {
    const msgsEl = document.getElementById('messages');
    const atBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 80;
    renderMsg(msg, true);
    if (atBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
    if (msg.type !== 'sys' && msg.from !== me.code) {
      notify(rooms[roomCode], msg);
      // Auto-play voice messages from others
      if (msg.type === 'voice') playVoice(msg.id, msg.audio, msg.mimeType);
    }
  } else {
    if (msg.from !== me?.code) {
      unread[roomCode] = (unread[roomCode] || 0) + 1;
      if (msg.from !== me?.code) notify(rooms[roomCode], msg);
    }
  }
  renderRoomList(document.getElementById('search-input').value);
}

function renderMsg(m, animate) {
  const msgsEl = document.getElementById('messages');
  const el = document.createElement('div');

  if (m.type === 'sys') {
    el.className = 'sys-msg';
    el.textContent = m.text;
    msgsEl.appendChild(el);
    return;
  }

  const isMine = m.from === me.code;
  el.className = 'msg-row' + (isMine ? ' mine' : '');
  if (animate) el.style.animation = 'none';

  // Check if previous message is from same sender (for avatar collapsing)
  const prev = msgsEl.lastElementChild;
  const prevSame = prev && !prev.classList.contains('sys-msg') &&
    prev.classList.contains(isMine ? 'mine' : '') && !prev.classList.contains(isMine ? '' : 'mine');

  const avatarHtml = `<div class="msg-avatar">${m.avatar || '?'}</div>`;
  const timeStr = fmtTime(m.at);

  let bubbleHtml;
  if (m.type === 'voice') {
    const dur = m.duration ? fmtDur(m.duration) : '—';
    const bars = Array.from({length:16},(_,i)=>`<span style="height:${4+Math.sin(i*.8)*10+Math.random()*8}px"></span>`).join('');
    bubbleHtml = `<div class="bubble voice-bubble">
      <button class="play-btn" onclick="playVoice('${m.id}','${m.audio ? m.id : ''}','${m.mimeType||''}',this)" data-audio='${m.audio||''}' data-mime='${m.mimeType||'audio/webm'}'>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="waveform" id="wf-${m.id}">${bars}</div>
      <span class="voice-dur">${dur}</span>
    </div>`;
  } else {
    bubbleHtml = `<div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}<span class="bubble-time">${timeStr}</span></div>`;
  }

  el.innerHTML = avatarHtml + `<div class="msg-wrap">${prevSame ? '' : `<span class="msg-sender">${isMine?'You':esc(m.name)}</span>`}${bubbleHtml}</div>`;
  msgsEl.appendChild(el);
}

// ── Voice playback ─────────────────────────────────────────────────────────────
const audioCache = {};
function playVoice(id, audioOrId, mimeType, btn) {
  const data = btn ? btn.dataset.audio : audioOrId;
  if (!data) return;
  if (!audioCache[id]) {
    const audio = new Audio(data);
    audioCache[id] = audio;
  }
  const audio = audioCache[id];
  const wf = document.getElementById('wf-' + id);

  if (!audio.paused) { audio.pause(); audio.currentTime = 0; if(wf) wf.classList.remove('playing'); return; }

  if (wf) wf.classList.add('playing');
  audio.play().catch(() => showToast('Tap again to play'));
  audio.onended = () => { if(wf) wf.classList.remove('playing'); };
}

// ── PTT (Push to Talk) ─────────────────────────────────────────────────────────
async function startPTT(e) {
  e.preventDefault();
  if (!activeRoom || isRecording) return;
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
    : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    mediaRec = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    audioChunks = [];
    recStart = Date.now();
    mediaRec.ondataavailable = ev => { if (ev.data.size > 0) audioChunks.push(ev.data); };
    mediaRec.start(100);
    isRecording = true;
    document.getElementById('ptt-btn').classList.add('recording');
    socket.emit('ptt-start', { roomCode: activeRoom });
  } catch { showToast('Microphone access denied — check browser permissions'); }
}

function stopPTT() {
  if (!isRecording || !mediaRec) return;
  isRecording = false;
  document.getElementById('ptt-btn').classList.remove('recording');
  const duration = Date.now() - recStart;
  if (duration < 300) { // too short, cancel
    mediaRec.stream.getTracks().forEach(t => t.stop());
    mediaRec = null;
    socket.emit('ptt-end', { roomCode: activeRoom });
    return;
  }
  mediaRec.onstop = () => {
    const blob = new Blob(audioChunks, { type: mediaRec.mimeType || 'audio/webm' });
    const reader = new FileReader();
    reader.onload = () => {
      socket.emit('voice', { roomCode: activeRoom, audio: reader.result, mimeType: blob.type, duration: Math.round(duration / 1000) });
      socket.emit('ptt-end', { roomCode: activeRoom });
    };
    reader.readAsDataURL(blob);
    mediaRec.stream.getTracks().forEach(t => t.stop());
    mediaRec = null;
  };
  mediaRec.stop();
}

// ── Text input ─────────────────────────────────────────────────────────────────
function inputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
}

function onInputChange() {
  const ta = document.getElementById('text-input');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  if (activeRoom) socket.emit('typing', { roomCode: activeRoom, on: ta.value.length > 0 });
}

function sendText() {
  const ta = document.getElementById('text-input');
  const text = ta.value.trim();
  if (!text || !activeRoom) return;
  socket.emit('msg', { roomCode: activeRoom, text });
  ta.value = ''; ta.style.height = 'auto';
  socket.emit('typing', { roomCode: activeRoom, on: false });
}

// ── Typing indicator ───────────────────────────────────────────────────────────
const typingUsers = {};
function updateTyping(code, name, on) {
  if (on) typingUsers[code] = name; else delete typingUsers[code];
  clearTimeout(typingTimer[code]);
  if (on) typingTimer[code] = setTimeout(() => { delete typingUsers[code]; renderTyping(); }, 3500);
  renderTyping();
}
function renderTyping() {
  const el = document.getElementById('typing-text');
  const names = Object.values(typingUsers).filter((_, i) => i < 2);
  if (!names.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<span class="typing-text">${esc(names.join(', '))} is typing <span class="typing-dots"><span></span><span></span><span></span></span></span>`;
}

// ── Presence ───────────────────────────────────────────────────────────────────
function updatePresence(code, isOnline) {
  online[code] = isOnline;
  Object.values(rooms).forEach(r => {
    const d = getRoomDisplay(r);
    if (d.otherCode === code) renderRoomList(document.getElementById('search-input').value);
  });
}

// ── Modal ──────────────────────────────────────────────────────────────────────
let modalTab = 'join';
function openModal(tab = 'join') {
  modalTab = tab;
  document.getElementById('modal').classList.remove('hidden');
  setModalTab(tab);
  if (tab === 'join') setTimeout(() => document.getElementById('modal-code').focus(), 100);
  if (tab === 'create') setTimeout(() => document.getElementById('modal-room-name').focus(), 100);
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); resetModal(); }
function closeModalOutside(e) { if (e.target.id === 'modal') closeModal(); }
function resetModal() {
  document.getElementById('modal-code').value = '';
  document.getElementById('modal-room-name').value = '';
  document.getElementById('lookup-result').classList.add('hidden');
  document.getElementById('modal-error').classList.add('hidden');
  document.getElementById('modal-join-btn').disabled = true;
  document.getElementById('modal-join-btn').style.opacity = '.5';
}
function setModalTab(tab) {
  modalTab = tab;
  document.querySelectorAll('.modal-tab').forEach((t,i)=>t.classList.toggle('active',(tab==='join'&&i===0)||(tab==='create'&&i===1)));
  document.getElementById('modal-join').classList.toggle('hidden', tab !== 'join');
  document.getElementById('modal-create').classList.toggle('hidden', tab !== 'create');
}

let lookupResult = null;
function lookupCode(val) {
  clearTimeout(lookupDebounce);
  document.getElementById('modal-error').classList.add('hidden');
  document.getElementById('lookup-result').classList.add('hidden');
  document.getElementById('modal-join-btn').disabled = true;
  document.getElementById('modal-join-btn').style.opacity = '.5';
  lookupResult = null;
  if (val.length < 4) return;
  lookupDebounce = setTimeout(async () => {
    try {
      const r = await fetch('/api/lookup/' + val.toUpperCase());
      const data = await r.json();
      if (data.error) {
        document.getElementById('modal-error').textContent = data.error;
        document.getElementById('modal-error').classList.remove('hidden');
      } else {
        lookupResult = data;
        document.getElementById('lr-avatar').textContent = data.avatar || (data.name||'?')[0].toUpperCase();
        document.getElementById('lr-name').textContent = data.name || 'Room';
        document.getElementById('lr-sub').textContent = data.type === 'user' ? 'User · ' + data.code : `Group · ${data.memberCount||0} members · ${data.code}`;
        document.getElementById('lookup-result').classList.remove('hidden');
        document.getElementById('modal-join-btn').disabled = false;
        document.getElementById('modal-join-btn').style.opacity = '1';
      }
    } catch {}
  }, 400);
}

function doJoin() {
  const code = document.getElementById('modal-code').value.trim().toUpperCase();
  if (!code) return;
  socket.emit('join', { code });
  closeModal();
}

function doCreate() {
  const name = document.getElementById('modal-room-name').value.trim();
  if (!name) return;
  socket.emit('join', { create: true, roomName: name });
  closeModal();
}

// ── Notifications ──────────────────────────────────────────────────────────────
function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}
function notify(room, msg) {
  if (!room || !msg) return;
  const d = getRoomDisplay(room);
  const title = d.name;
  const body = msg.type === 'voice' ? `🎙 ${msg.name} sent a voice message` : `${msg.name}: ${msg.text?.slice(0,80)}`;
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    new Notification(title, { body, icon: '/icon.svg' });
  }
  if (document.hidden || room.code !== activeRoom) showToast(`${title}: ${body.slice(0,60)}`);
}

// ── Copy helpers ───────────────────────────────────────────────────────────────
function copyMyCode() { navigator.clipboard?.writeText(me.code).then(()=>showToast('Your code copied: ' + me.code)); }
function copyRoomCode() {
  const room = rooms[activeRoom];
  if (!room || room.type !== 'group') return;
  navigator.clipboard?.writeText(room.code).then(()=>showToast('Room code copied: ' + room.code));
}

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

// ── Utils ──────────────────────────────────────────────────────────────────────
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function fmtDur(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
</script>
